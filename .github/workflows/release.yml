name: Build & Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Standalone Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Create Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            export VERSION="${GITHUB_REF#refs/tags/}"
          else
            export VERSION="v0.4.${{ github.run_number }}"
          fi
          export APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          export RELEASE_APK="ReelCount-${VERSION}.apk"
          cp "$APK_FILE" "$RELEASE_APK"

          export COMMIT_TITLE=$(git log -1 --pretty=%s)
          export RELEASE_TITLE="ReelCount ${VERSION} - ${COMMIT_TITLE}"

          python3 - << 'PYEOF'
          import os

          version = os.environ.get("VERSION", "v0.4")
          release_apk = os.environ.get("RELEASE_APK", "ReelCount.apk")
          commit_title = os.environ.get("COMMIT_TITLE", "Update")
          sha = os.environ.get("GITHUB_SHA", "")

          notes = f"""## 📱 ReelCount {version}

          ### 🚀 What's New in This Release:
          - **Change**: {commit_title}
          - **Commit**: `{sha}`

          ### ✨ Major Enhancements:
          - **Sanctuary Atmosphere Theme System**:
            - 6 full dynamic palettes: **Obsidian Mint** (Zen Clarity), **Cyber Sky** (Electric Flow), **Amethyst Aura** (Mystic Depth), **Solar Amber** (Vitality & Focus), **Neon Rose** (Radical Awareness), and **Pure Titanium** (Brutalist Minimal).
            - Real-time whole-app immersion: Android status bar, screen backdrops, card surfaces, and hairlines dynamically adapt to the active atmosphere.
            - Interactive 2-Column Atmosphere Showcase Grid with circular vector halos, dual-tone swatch dots, and active badges.
            - Full native floating overlay HUD synchronization in `ReelCountOverlayHud.kt`.
          - **Harmonized Modals & Dials**:
            - Craving SOS Sanctuary Modal with 4-mode switcher (4-4-4 Box Breath, 90s Delay Surfer, 5-4-3-2-1 Sensory Grounding, Stroop Urge Gate).
            - 24-Hour Circadian Attention Clock & horizontal hourly bar dial with haptic feedback.
            - Reactive switches and toggles across all limit and shield settings.
          - **Liquid Glass Floating Capsule Dock**:
            - Floating pill-shaped dock with translucent frosted obsidian glass, specular rim lighting, and ambient underglow.
            - **Hold & Slide Gesture Navigation**: Continuous horizontal thumb scrubbing with real-time sliding indicator and haptic feedback.
            - **Continuous Fisheye Magnification**: Gaussian wave magnification up to `1.30x` with `-8.5dp` elevation and velocity tilt.
            - **Dynamic Island Preview Tooltip Capsule**: Real-time live status capsule hovering over active scrubbing.
            - **Live Micro-Badges**: Today's video count, limits warning dot, and active focus shield countdown directly on dock tabs.
            - **Optical Shimmer & Touch Ripple**: Specular light refraction beam and liquid contact ripple waves.
          - **Decluttered Minimal Dashboard**:
            - Clean, simplified dashboard tab showing core essentials: concentric hero ring, dopamine gauge, 4-stat grid, expandable platform breakdown, and 7-day rhythm chart.
          - **4-Slide Horizontal Onboarding Carousel**:
            - Paged swipe carousel with minimal text, progress pagination dots, and 4 custom 16:9 Obsidian Mint 3D illustrations.
          - **Short Video Tracking Accuracy Fix**:
            - Fixed scroll swipe detection in Instagram Reels, TikTok, and YouTube Shorts; eliminated false increments caused by opening comment sheets.

          ### 📥 Download & Installation Notes:
          1. Download the attached **`{release_apk}`** below directly to your Android phone.
          2. Tap the downloaded APK to install.
          3. **If Google Play Protect displays "App Blocked"**:
             - Because ReelCount uses Android's Accessibility Service to detect video scrolling, Play Protect flags sideloaded APKs by default.
             - Tap **"More details"** (or dropdown arrow) → tap **"Install anyway"**.
             - Alternatively, in Google Play Store → Profile → Play Protect → Settings (gear) → toggle off "Scan apps with Play Protect" during installation.
          4. **On Android 13+ (Restricted Settings)**:
             - Open **Settings → Apps → ReelCount → ⋮ (3 dots top-right) → Allow restricted settings**.
             - Then open **Settings → Accessibility → ReelCount** and toggle it ON.
          """

          with open("release_notes.md", "w") as f:
              f.write(notes)
          PYEOF

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Updating asset..."
            gh release upload "$VERSION" "$RELEASE_APK" --clobber
          else
            gh release create "$VERSION" "$RELEASE_APK" \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md
          fi
