name: Build & Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Create Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v0.2.${{ github.run_number }}"
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="ReelCount-${VERSION}.apk"
          cp "$APK_FILE" "$RELEASE_APK"

          COMMIT_TITLE=$(git log -1 --pretty=%s)
          RELEASE_TITLE="ReelCount ${VERSION} - ${COMMIT_TITLE}"

          cat << 'EOF' > release_notes.md
          ## 📱 ReelCount ${VERSION}

          ### 🚀 What's New in This Release:
          - **Change**: ${COMMIT_TITLE}
          - **Commit**: `${{ github.sha }}`

          ### ✨ Key Features Included:
          - **True Native App Blocking**: Blocks target apps (Instagram, TikTok, YouTube, Snapchat) during Focus Sessions and automatically returns to Home (`GLOBAL_ACTION_HOME`).
          - **Persistent Counting & 7-Day Bar Chart**: Local device storage saves counts across phone reboots and displays weekly usage trends on the dashboard.
          - **Daily Limit Alerts & Notifications**: Push notification and red warning badge when your daily short limit is reached.
          - **Draggable Floating HUD with Position Memory**: Real-time swipe counter remembers where you placed it on the screen.
          - **Haptic Feedback**: Gentle vibration pulse on every detected short video scroll.
          - **Custom App Icon**: Fresh emerald film-reel icon across all Android device resolutions.

          ### 📥 Download & Installation Notes:
          1. Download the attached **`${RELEASE_APK}`** below directly to your Android phone.
          2. Tap the downloaded APK to install.
          3. **If Google Play Protect displays "App Blocked"**:
             - Because ReelCount uses Android's Accessibility Service to detect video scrolling, Play Protect flags sideloaded APKs by default.
             - Tap **"More details"** (or dropdown arrow) → tap **"Install anyway"**.
             - Alternatively, in Google Play Store → Profile → Play Protect → Settings (gear) → toggle off "Scan apps with Play Protect" during installation.
          4. **On Android 13+ (Restricted Settings)**:
             - Open **Settings → Apps → ReelCount → ⋮ (3 dots top-right) → Allow restricted settings**.
             - Then open **Settings → Accessibility → ReelCount** and toggle it ON.
          EOF

          sed -i "s/\${VERSION}/${VERSION}/g" release_notes.md
          sed -i "s/\${RELEASE_APK}/${RELEASE_APK}/g" release_notes.md
          sed -i "s/\${COMMIT_TITLE}/${COMMIT_TITLE}/g" release_notes.md

          gh release create "$VERSION" "$RELEASE_APK" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md
